
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Fonts</title>

<style>

@font-face {
  font-family: 'Cecilia';
  src: url('./Cecilia-Regular.woff') format('woff');
}

@font-face {
  font-family: 'ThaiByCelia';
  src: url('./Thaibycelia-Regular.woff') format('woff');
}

@font-face {
  font-family: 'Wavey';
  src: url('./Waveyyy-Regular.woff') format('woff');
}

body {
  font-family: sans-serif;
  padding: 40px;
  background: #f4f4f4;
}

h1 {
  margin-bottom: 40px;
}

.font-card {
  background: white;
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  max-width: 700px;
}

.preview {
  font-size: 40px;
  margin: 20px 0;
  word-break: break-word;
}

.cecilia-font {
  font-family: 'Cecilia';
}

.thai-font {
  font-family: 'Thaibycelia';
}

.wavey-font {
  font-family: 'Wavey';
}

input {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  margin-top: 12px;
  box-sizing: border-box;
}

a {
  display: inline-block;
  margin-top: 20px;
  text-decoration: none;
  padding: 12px 18px;
  background: black;
  color: white;
  border-radius: 8px;
  transition: 0.2s ease;
}

a:hover {
  opacity: 0.85;
  transform: translateY(-2px);
}

</style>
</head>

<body>

<h1>My Font Collections</h1>


<div class="font-card">

  <h2>Cecilia Made It</h2>

  <p class="preview cecilia-font">
    The quick brown fox jumps over the lazy dog
  </p>

  <input
    type="text"
    class="preview-input"
    placeholder="tell me a secret"
  >

  <a href="./Cecilia-Regular.woff" download>
    Download Font
  </a>

</div>



<div class="font-card">

  <h2>Wavey</h2>

  <p class="preview wavey-font">
    The quick brown fox jumps over the lazy dog
  </p>

  <input
    type="text"
    class="preview-input"
    placeholder="what's on ur mind"
  >

  <a href="./Waveyyy-Regular.woff" download>
    Download Font
  </a>

</div>
<div class="font-card">

  <h2>In Thai</h2>

  <p class="preview thai-font">
    ขอให้วันนี้เป็นวันที่น่ารักนะคะ
  </p>

  <input
    type="text"
    class="preview-input"
    placeholder="เขียนความในใจ..."
  >

  <a href="./Thaibycelia-Regular.woff" download>
    Download Font
  </a>

</div>
<script>

document.querySelectorAll(".font-card").forEach(card => {

  const input = card.querySelector(".preview-input");
  const preview = card.querySelector(".preview");

  const defaultText = preview.textContent;

  input.addEventListener("input", () => {
    preview.textContent = input.value || defaultText;
  });

});

</script>

</html>
