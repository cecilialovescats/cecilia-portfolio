
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cecilia ♡ Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #fffafa;
    font-family: "Trebuchet MS", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.portfolio {
    width: 760px;
    max-width: 100%;
}

.device {
    position: relative;
    background: linear-gradient(145deg,#ffb3cd,#ed7fa8);
    padding: 12px;
    border-radius: 32px;
    box-shadow: 0 8px 0 #ce6d96,
                0 18px 30px #b66d8950;
}

.screen {
    min-height: 390px;
    background: #a9bdf2;
    border: 5px solid #f7a6c4;
    border-radius: 25px;
    position: relative;
}

/* LARGE ROUND IMAGE DISPLAY */
.preview-frame {
    position: absolute;
    z-index: 3;
    left: 12px;
    top: -25px;
    width: 440px;
    height: 440px;
    border-radius: 50%;
    background: #fff;
    border: 12px solid #e7e9eb;
    box-shadow: inset 0 0 15px #aaa,
                0 5px 12px #7775;
    overflow: hidden;
}

.preview-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #fff;
}

.preview-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .3s ease;
}

.preview-decoration {
    position: absolute;
    font-size: 35px;
    pointer-events: none;
}

.flower1 { top: 20px; left: 45px; }
.flower2 { top: 25px; right: 45px; }
.flower3 { bottom: 55px; left: 30px; }
.flower4 { bottom: 55px; right: 35px; }

.preview-caption {
    position: absolute;
    bottom: 27px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ad79a5;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 1px white;
    pointer-events: none;
}

/* RIGHT PROJECT PANEL */
.menu {
    position: absolute;
    right: 48px;
    top: 15px;
    width: 195px;
    min-height: 325px;
    border-radius: 25px;
    background: linear-gradient(145deg,#aaa2e7,#c0b5f0);
    padding: 12px;
}

.menu-title {
    text-align: center;
    font-size: 12px;
    color: white;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 1px 2px #777;
}

.categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.category {
    height: 67px;
    border-radius: 19px;
    border: 3px solid #ffffff90;
    background: linear-gradient(145deg,#fff,#fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-decoration: none;
    color: #a778a6;
    box-shadow: inset 0 2px 5px #ddd;
    transition: .25s;
    cursor: pointer;
}

.category:hover,
.category:focus-visible {
    transform: scale(1.07);
    border-color: white;
    background: white;
    box-shadow: 0 4px 10px #7774;
    outline: none;
}

.category span {
    font-size: 24px;
}

.category small {
    font-size: 9px;
    font-weight: bold;
}

/* DECORATIVE SIDE BUTTONS */
.side-buttons {
    position: absolute;
    right: 8px;
    top: 25px;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.side-buttons a {
    width: 32px;
    height: 32px;
    background: linear-gradient(white,#d9dafa);
    border: 3px solid #8e9cdd;
    border-radius: 50%;
    display: grid;
    place-items: center;
    text-decoration: none;
    color: #8a80c9;
    font-size: 16px;
}

/* BOTTOM TOY BUTTONS */
.controls {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 15px;
    position: relative;
}

.controls span {
    display: block;
    width: 31px;
    height: 31px;
    border-radius: 50%;
    background: linear-gradient(145deg,#9bf078,#55d94e);
    border: 3px solid #a2e58b;
    box-shadow: 0 3px 4px #7775;
}

.controls span:first-child {
    width: 39px;
    height: 19px;
    margin-top: 7px;
    border-radius: 20px;
}

/* FOOTER */
footer {
    text-align: center;
    color: #c18eae;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 35px;
}

/* MOBILE RESPONSIVE */
@media(max-width:650px) {
    body {
        padding: 25px 12px;
    }

    .screen {
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .preview-frame {
        position: relative;
        left: auto;
        top: auto;
        width: min(100%,340px);
        height: auto;
        aspect-ratio: 1;
        margin: 0 auto;
    }

    .menu {
        position: relative;
        top: auto;
        right: auto;
        width: 100%;
        min-height: auto;
    }

    .categories {
        grid-template-columns: repeat(4,1fr);
    }

    .category {
        height: 65px;
    }

    .side-buttons {
        display: none;
    }
}
</style>
</head>

<body>

<div class="portfolio">

    <div class="device">

        <div class="screen">

            <!-- MAIN IMAGE PREVIEW -->
            <div class="preview-frame">
                <div class="preview-inner">

                    <img
                        id="mainPreview"
                        src="pic1.jpg"
                        alt="Portfolio preview"
                    >

                    <span class="preview-decoration flower1">🌼</span>
                    <span class="preview-decoration flower2">🌸</span>
                    <span class="preview-decoration flower3">🌷</span>
                    <span class="preview-decoration flower4">🌺</span>

                    <div class="preview-caption" id="caption">
                        WELCOME TO MY WORLD ♡
                    </div>

                </div>
            </div>

            <div class="menu">

                <div class="menu-title">MY LITTLE WORLD ♡</div>

                <div class="categories">

                    <a href="font.html"
                       class="category project"
                       data-preview="pic2.jpg"
                       data-title="FONTS">

                        <span>🎀</span>
                        <small>FONTS</small>
                    </a>

                    <a href="design.html"
                       class="category project"
                       data-preview="pic3.jpg"
                       data-title="DESIGN">

                        <span>🎨</span>
                        <small>DESIGN</small>
                    </a>

                    <a href="photography.html"
                       class="category project"
                       data-preview="pic4.jpg"
                       data-title="PHOTOGRAPHY">

                        <span>📷</span>
                        <small>PHOTO</small>
                    </a>

                    <a href="drawing.html"
                       class="category project"
                       data-preview="pic5.jpg"
                       data-title="art">

                        <span>🦋</span>
                        <small>ART</small>
                    </a>

                    <a href="project5.html"
                       class="category project"
                       data-preview="pic6.jpg"
                       data-title="DRAWINGS">

                        <span>🌸</span>
                        <small>DRAWINGS</small>
                    </a>

                    <a href="project6.html"
                       class="category project"
                       data-preview="pic7.jpg"
                       data-title="CREATIVE WORK">

                        <span>🧸</span>
                        <small>CREATIVE</small>
                    </a>

                    <a href="me.html"
                       class="category project"
                       data-preview="pic8.jpg"
                       data-title="PERSONAL PROJECTS">

                        <span>🍒</span>
                        <small>PERSONAL</small>
                    </a>

                    <a href="project8.html"
                       class="category project"
                       data-preview="pic9.jpg"
                       data-title="MORE WORK">

                        <span>⭐</span>
                        <small>MORE</small>
                    </a>

                </div>
            </div>


            <div class="side-buttons">
                <a href="about.html">♡</a>
                <a href="contact.html">✉</a>
                <a href="me.html">☻</a>
            </div>

        </div>

        <div class="controls">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <footer>♡ THANK YOU FOR VISITING ♡</footer>

</div>

<script>
const preview = document.getElementById("mainPreview");
const caption = document.getElementById("caption");

const originalImage = "pic1.jpg";
const originalCaption = "WELCOME TO MY WORLD ♡";

const projects = document.querySelectorAll(".project");

function showProject(project) {
    preview.style.opacity = "0";

    setTimeout(() => {
        preview.src = project.dataset.preview;
        caption.textContent = project.dataset.title;
        preview.style.opacity = "1";
    }, 150);
}

function resetPreview() {
    preview.style.opacity = "0";

    setTimeout(() => {
        preview.src = originalImage;
        caption.textContent = originalCaption;
        preview.style.opacity = "1";
    }, 150);
}

projects.forEach(project => {

    project.addEventListener("mouseenter", () => {
        showProject(project);
    });

    project.addEventListener("mouseleave", () => {
        resetPreview();
    });

    project.addEventListener("focus", () => {
        showProject(project);
    });

    project.addEventListener("blur", () => {
        resetPreview();
    });

});
</script>

</body>
</html>
