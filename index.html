<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Cecilia portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'VT323', monospace;
    background:black;
    animation:flicker 0.08s infinite;
}


.background{
    position:fixed;
    inset:0;

    background-image:url("images/546feeff-c6b9-4bf3-b8e7-2b28f70b96e4.jpg");

    background-size:cover;
    background-position:center;

    transition:0.4s ease;

    filter:
        brightness(0.8)
        contrast(1.2)
        saturate(0.7)
        blur(0.5px);

    image-rendering:pixelated;
}



.background::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}



.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
    );
}



.menu{
    position:absolute;
    top:50%;
    left:10%;
    transform:translateY(-50%);
    color:white;
    z-index:2;
}

.menu h1{
    font-size:70px;
    margin-bottom:30px;
    letter-spacing:4px;

    text-shadow:
        0 0 5px white,
        0 0 20px white;
}

.menu ul{
    list-style:none;
}

.menu li{
    margin:25px 0;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:52px;

    position:relative;

    transition:0.2s;
}


.menu a::before{
    content:"▶";

    position:absolute;

    left:-40px;

    opacity:0;

    transition:0.2s;
}

.menu a:hover::before{
    opacity:1;
}


.menu a:hover{
    color:#d8d8d8;

    transform:translateX(10px);

    text-shadow:
        0 0 5px white,
        0 0 20px white;
}



@keyframes flicker{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.985;
    }

    100%{
        opacity:1;
    }

}

</style>
</head>

<body>



<div class="background" id="bg"></div>


<div class="scanlines"></div>



<div class="menu">

    <h1>MENU</h1>

    <ul>

        <li>
            <a href="me.html"
               data-img="images/Cecilia.jpg">
               ABOUT
            </a>
        </li>

        <li>
            <a href="design.html"
               data-img="images/Cecilia(1).jpg">
               PROJECTS
            </a>
        </li>

        <li>
            <a href="drawings.html"
               data-img="images/gallery.jpg">
               ART GALLERY
            </a>
        </li>

        <li>
            <a href="photography.html"
               data-img="images/contact.jpg">
               photography
            </a>
        </li>

    </ul>

</div>

<script>


const bg = document.getElementById("bg");



const links = document.querySelectorAll(".menu a");



links.forEach(link => {

    link.addEventListener("mouseenter", () => {

        const image = link.getAttribute("data-img");

        bg.style.backgroundImage = `url(${image})`;

    });


    link.addEventListener("mouseleave", () => {

        bg.style.backgroundImage =
        `url(images/546feeff-c6b9-4bf3-b8e7-2b28f70b96e4.jpg)`;

    });

});

</script>

</body>
</html>
