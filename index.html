
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cecilia ♡ Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: "Trebuchet MS", sans-serif;
    background:
        linear-gradient(#ffffff15, #ffffff15),
        img src="bgph.png" center center / cover fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
}

.home {
    width: 1050px;
    max-width: 100%;
    display: grid;
    grid-template-columns: 1fr 390px;
    gap: 35px;
    align-items: center;
}

.intro {
    text-align: center;
    padding: 25px;
}

.intro h1 {
    font-size: clamp(40px, 7vw, 75px);
    color: white;
    -webkit-text-stroke: 1.5px #d68eb5;
    text-shadow: 3px 4px #b878a2;
    letter-spacing: 3px;
}

.intro p {
    display: inline-block;
    margin-top: 15px;
    background: #ffffffd9;
    color: #b47b9f;
    border-radius: 30px;
    padding: 12px 22px;
    font-size: 13px;
    letter-spacing: 1px;
}

.intro .decoration {
    font-size: 32px;
    margin-top: 20px;
    letter-spacing: 15px;
}

.device {
    background: linear-gradient(145deg,#ffc3d9,#ec82ad);
    padding: 13px;
    border-radius: 32px;
    border: 2px solid #fff1f7;
    box-shadow:
        0 9px 0 #d36d9b,
        0 20px 35px #85546b55;
    position: relative;
}

.screen {
    background: #a9bdf2;
    border: 5px solid #f8b3cf;
    border-radius: 24px;
    padding: 15px;
}

.display {
    background: linear-gradient(145deg,#fff,#fff6fb);
    border: 7px solid #e7e9ec;
    border-radius: 24px;
    padding: 12px;
    box-shadow: inset 0 0 12px #bbb;
}

.display-image {
    height: 215px;
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    background: #f9e9f3;
}

.display-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .3s ease;
}

.display-label {
    position: absolute;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 12px;
    color: #a36e9b;
    background: #ffffffc9;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
}

.panel-title {
    color: white;
    text-align: center;
    font-size: 16px;
    letter-spacing: 3px;
    font-weight: bold;
    text-shadow: 2px 2px #897ab9;
    margin: 17px 0 13px;
}

.projects {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.project {
    text-decoration: none;
    background: linear-gradient(145deg,#fff,#fff0f7);
    border: 3px solid #ffffffa8;
    border-radius: 15px;
    padding: 5px;
    text-align: center;
    transition: .25s;
    box-shadow: inset 0 0 6px #ddd;
}

.project:hover,
.project:focus-visible {
    transform: translateY(-5px) scale(1.04);
    background: white;
    box-shadow: 0 6px 12px #735b8c55;
    outline: none;
}

.project img {
    width: 100%;
    height: 66px;
    object-fit: cover;
    border-radius: 9px;
    display: block;
}

.project span {
    display: block;
    color: #a4779b;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: .5px;
    padding: 7px 0 3px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 13px 0 3px;
}

.controls span {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: linear-gradient(145deg,#a4f47f,#58d64e);
    border: 3px solid #a3e68f;
    box-shadow: 0 3px 4px #7775;
}

.controls span:first-child {
    width: 38px;
    height: 18px;
    margin-top: 5px;
    border-radius: 20px;
}

.footer {
    text-align: center;
    color: white;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 1px 2px #a36e9b;
    margin-top: 17px;
}

@media(max-width: 750px) {
    body {
        padding: 20px 12px;
        background-attachment: scroll;
    }

    .home {
        grid-template-columns: 1fr;
        gap: 15px;
        max-width: 430px;
    }

    .intro {
        padding: 5px;
    }

    .intro h1 {
        font-size: 43px;
    }

    .display-image {
        height: 220px;
    }
}
</style>
</head>

<body>

<div class="home">

    <section class="intro">

        <h1>CECILIA ♡</h1>

        <p>WELCOME TO MY LITTLE WORLD</p>

        <div class="decoration">
            ✿ ☆ ♡ ☆ ✿
        </div>

    </section>


    <section class="device">

        <div class="screen">

            <div class="display">

                <div class="display-image">

                    <img
                        id="preview"
                        src="images/profile.jpg"
                        alt="Portfolio preview"
                    >

                    <div class="display-label" id="previewTitle">
                        WELCOME TO MY WORLD ♡
                    </div>

                </div>

            </div>


            <h2 class="panel-title">
                MY LITTLE WORLD ♡
            </h2>

            <div class="projects">

                <a href="fonts.html"
                   class="project"
                   data-image="images/fonts.jpg"
                   data-title="MY FONTS">

                    <img src="images/fonts.jpg" alt="Fonts project">
                    <span>FONTS</span>
                </a>

                <a href="design.html"
                   class="project"
                   data-image="images/design.jpg"
                   data-title="MY DESIGNS">

                    <img src="images/design.jpg" alt="Design project">
                    <span>DESIGN</span>
                </a>

                <a href="photo.html"
                   class="project"
                   data-image="images/photo.jpg"
                   data-title="PHOTOGRAPHY">

                    <img src="images/photo.jpg" alt="Photography project">
                    <span>PHOTO</span>
                </a>

                <a href="drawing.html"
                   class="project"
                   data-image="images/drawing.jpg"
                   data-title="MY DRAWINGS">

                    <img src="images/drawing.jpg" alt="Drawing project">
                    <span>DRAWING</span>
                </a>

                <a href="art.html"
                   class="project"
                   data-image="images/art.jpg"
                   data-title="MY ART">

                    <img src="images/art.jpg" alt="Art project">
                    <span>ART</span>
                </a>

                <a href="creative.html"
                   class="project"
                   data-image="images/creative.jpg"
                   data-title="CREATIVE WORK">

                    <img src="images/creative.jpg" alt="Creative work">
                    <span>CREATIVE</span>
                </a>

            </div>

        </div>

        <div class="controls">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </section>

</div>

<script>
const preview = document.getElementById("preview");
const previewTitle = document.getElementById("previewTitle");

const defaultImage = "images/profile.jpg";
const defaultTitle = "WELCOME TO MY WORLD ♡";

const projectLinks = document.querySelectorAll(".project");

function changePreview(project) {
    preview.style.opacity = "0";

    setTimeout(() => {
        preview.src = project.dataset.image;
        previewTitle.textContent = project.dataset.title;
        preview.style.opacity = "1";
    }, 150);
}

function resetPreview() {
    preview.style.opacity = "0";

    setTimeout(() => {
        preview.src = defaultImage;
        previewTitle.textContent = defaultTitle;
        preview.style.opacity = "1";
    }, 150);
}

projectLinks.forEach(project => {

    project.addEventListener("mouseenter", () => {
        changePreview(project);
    });

    project.addEventListener("mouseleave", resetPreview);

    project.addEventListener("focus", () => {
        changePreview(project);
    });

    project.addEventListener("blur", resetPreview);

});
</script>

</body>
</html>
