
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #fffafa;
    font-family: "Trebuchet MS", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.portfolio {
    width: 740px;
    max-width: 100%;
}

/* Main pink frame */
.device {
    background: #f28db3;
    padding: 12px;
    border-radius: 28px;
    box-shadow: 0 8px 0 #d56c98, 0 15px 30px #d99ab955;
}

.screen {
    background: #aabcf1;
    border: 4px solid #f8b5ce;
    border-radius: 20px;
    padding: 12px;
    display: grid;
    grid-template-columns: 1.5fr 0.9fr;
    gap: 12px;
}

/* Character display */
.character {
    min-height: 350px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff, #f5f5fa);
    border: 9px solid #e5e8eb;
    box-shadow: inset 0 0 12px #bbb;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.character img {
    width: 85%;
    max-height: 300px;
    object-fit: contain;
    position: relative;
    z-index: 2;
}

.character-name {
    position: absolute;
    bottom: 35px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #b77ca3;
    z-index: 3;
    font-weight: bold;
}

.flower {
    position: absolute;
    font-size: 30px;
}

.flower.one { top: 25px; left: 35px; }
.flower.two { top: 30px; right: 35px; }
.flower.three { bottom: 55px; left: 25px; }
.flower.four { bottom: 55px; right: 25px; }

/* Portfolio categories */
.menu {
    background: #aaa3e8;
    border-radius: 20px;
    padding: 14px;
}

.menu-title {
    color: white;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-shadow: 1px 2px #8178b8;
}

.categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.category {
    aspect-ratio: 1;
    border: 3px solid #ffffff90;
    border-radius: 17px;
    background: #fff4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
    text-decoration: none;
    color: #a36f9d;
    transition: .25s;
    box-shadow: inset 0 0 8px #ffffff;
}

.category:hover {
    transform: scale(1.06);
    background: white;
    box-shadow: 0 5px 10px #6b599955;
}

.category span {
    font-size: 27px;
}

.category small {
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* Bottom controls */
.controls {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 14px;
}

.controls span {
    background: #83e36d;
    border: 3px solid #9de48d;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    box-shadow: 0 3px 3px #7775;
}

/* Bottom portfolio icons */
.section-title {
    text-align: center;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 2px;
    color: white;
    -webkit-text-stroke: 1px #333;
    text-shadow: 2px 3px #999;
    margin-top: 35px;
}

.projects {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 20px;
}

.project {
    text-decoration: none;
    font-size: 38px;
    transition: .25s;
    filter: drop-shadow(2px 3px 2px #aaa);
}

.project:hover {
    transform: translateY(-8px) rotate(-10deg);
}

.project-label {
    display: block;
    text-align: center;
    font-size: 10px;
    color: #a5789a;
    margin-top: 5px;
    letter-spacing: 1px;
}

footer {
    text-align: center;
    color: #c18eae;
    font-size: 11px;
    margin-top: 35px;
    letter-spacing: 2px;
}

/* Mobile */
@media(max-width: 550px) {
    .screen {
        grid-template-columns: 1fr;
    }

    .character {
        min-height: 290px;
    }

    .menu {
        padding: 15px;
    }

    .categories {
        grid-template-columns: repeat(4, 1fr);
    }

    .category small {
        font-size: 8px;
    }

    .projects {
        gap: 18px;
    }
}
</style>
</head>

<body>

<div class="portfolio">

    <div class="device">

        <div class="screen">

            <!-- YOUR CHARACTER / PROFILE -->
            <div class="character">

                <span class="flower one">🌼</span>

            <!-- PORTFOLIO NAVIGATION -->
            <div class="menu">

                <div class="categories">

                    <a href="about.html" class="category">
                        <span>♡</span>

                    </a>

                    <a href="works.html" class="category">
                        <span>✿</span>
                        <small>WORKS</small>
                    </a>

                    <a href="design.html" class="category">
                        <span>🎨</span>
                        <small>DESIGN</small>
                    </a>

                    <a href="photography.html" class="category">

                    </a>

                    <a href="contact.html" class="category">

                    <a href="resume.pdf" class="category">

                    </a>

                    <a href="illustrations.html" class="category">
                        <span>🦋</span>
                        <small>ART</small>
                    </a>

                    <a href="playground.html" class="category">
                        <span>☆</span>
                        <small>MORE</small>
                    </a>

                </div>

            </div>

        </div>

        <!-- DECORATIVE BUTTONS -->
        <div class="controls">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- BOTTOM SHORTCUTS -->
    <h2 class="section-title">MY LITTLE PROJECTS</h2>

    <div class="projects">

        <a href="project4.html" class="project">

        </a>

        <a href="project5.html" class="project">
            🌸

        </a>

    </div>

    <footer>MADE WITH LOVE ♡ © 2026</footer>

</div>

</body>
</html>
