
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cecilia</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #fffafa;
    font-family: "Trebuchet MS", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.portfolio {
    width: 760px;
    max-width: 100%;
}

.device {
    position: relative;
    background: linear-gradient(145deg,#ffb3cd,#ed7fa8);
    padding: 12px;
    border-radius: 32px;
    box-shadow:
        0 8px 0 #ce6d96,
        0 18px 30px #b66d8950;
}

.screen {
    height: 390px;
    background: #a9bdf2;
    border: 5px solid #f7a6c4;
    border-radius: 25px;
    position: relative;
    overflow: visible;
}


.preview-frame {
    position: absolute;
    z-index: 3;
    left: 12px;
    top: -25px;
    width: 440px;
    height: 440px;
    border-radius: 50%;
    background: linear-gradient(145deg,#fff,#e8e9ed);
    border: 12px solid #e7e9eb;
    box-shadow:
        inset 0 0 15px #aaa,
        0 5px 12px #7775;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.preview-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #fff;
}

.preview-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .25s ease;
}

.preview-decoration {
    position: absolute;
    font-size: 35px;
    pointer-events: none;
}

.flower1 { top: 20px; left: 45px; }
.flower2 { top: 25px; right: 45px; }
.flower3 { bottom: 55px; left: 30px; }
.flower4 { bottom: 55px; right: 35px; }

.preview-caption {
    position: absolute;
    bottom: 27px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ad79a5;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 1px white;
    pointer-events: none;
}


.menu {
    position: absolute;
    right: 48px;
    top: 15px;
    width: 195px;
    height: 325px;
    border-radius: 25px;
    background: linear-gradient(145deg,#aaa2e7,#c0b5f0);
    padding: 12px;
}

.menu-title {
    text-align: center;
    font-size: 12px;
    color: white;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 1px 2px #777;
}

.categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.category {
    height: 67px;
    border-radius: 19px;
    border: 3px solid #ffffff90;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-decoration: none;
    color: #a778a6;
    box-shadow: inset 0 2px 5px #ddd;
    transition: .2s;
}

.category:hover {
    transform: scale(1.07);
    border-color: white;
}

.category span {
    font-size: 24px;
}

.category small {
    font-size: 9px;
    font-weight: bold;
}

.side-buttons {
    position: absolute;
    right: 8px;
    top: 25px;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.side-buttons a {
    width: 32px;
    height: 32px;
    background: linear-gradient(white,#d9dafa);
    border: 3px solid #8e9cdd;
    border-radius: 50%;
    display: grid;
    place-items: center;
    text-decoration: none;
    color: #8a80c9;
    font-size: 16px;
}


.controls {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 15px;
    position: relative;
    z-index: 4;
}

.controls span {
    display: block;
    width: 31px;
    height: 31px;
    border-radius: 50%;
    background: linear-gradient(145deg,#9bf078,#55d94e);
    border: 3px solid #a2e58b;
    box-shadow: 0 3px 4px #7775;
}

.controls span:first-child {
    width: 39px;
    height: 19px;
    margin-top: 7px;
    border-radius: 20px;
}

.heading {
    text-align: center;
    margin-top: 35px;
    color: white;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 2px;
    -webkit-text-stroke: 1px #292929;
    text-shadow: 2px 3px #888;
}

.projects {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 20px;
}

.project {
    text-decoration: none;
    text-align: center;
    transition: .25s;
}

.project img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    filter: drop-shadow(2px 3px 2px #7775);
    transition: .25s;
}

.project:hover img {
    transform: translateY(-9px) rotate(-8deg) scale(1.12);
}

.project small {
    display: block;
    font-size: 10px;
    color: #a4779b;
    font-weight: bold;
    margin-top: 5px;
}

footer {
    text-align: center;
    color: #c18eae;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 35px;
}

@media(max-width:650px) {
    .screen {
        height: auto;
        min-height: 0;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .preview-frame {
        position: relative;
        left: auto;
        top: auto;
        width: min(100%, 340px);
        height: auto;
        aspect-ratio: 1;
        margin: 0 auto;
    }

    .menu {
        position: relative;
        top: auto;
        right: auto;
        width: 100%;
        height: auto;
    }

    .categories {
        grid-template-columns: repeat(4,1fr);
    }

    .side-buttons {
        display: none;
    }

    .projects {
        flex-wrap: wrap;
        gap: 18px;
    }

    .project img {
        width: 48px;
        height: 48px;
    }
}
</style>
</head>

<body>

<div class="portfolio">

    <div class="device">

        <div class="screen">

    
            <div class="preview-frame">

                <div class="preview-inner">

                    <img
                        id="mainPreview"
                        src="images/profile.jpg"
                        alt="Portfolio preview"
                    >

                    <span class="preview-decoration flower1">🌼</span>
                    <span class="preview-decoration flower2">🌸</span>
                    <span class="preview-decoration flower3">🌷</span>
                    <span class="preview-decoration flower4">🌺</span>

                    <div class="preview-caption" id="caption">
                        WELCOME TO MY WORLD ♡
                    </div>

                </div>

            </div>

            <div class="menu">

                <div class="menu-title">MY LITTLE WORLD</div>

                <div class="categories">

                    <a href="about.html" class="category">
                        <span>♡</span>
                        <small>ABOUT</small>
                    </a>

                    <a href="works.html" class="category">
                        <span>✿</span>
                        <small>WORKS</small>
                    </a>

                    <a href="design.html" class="category">
                        <span>🎨</span>
                        <small>DESIGN</small>
                    </a>

                    <a href="photo.html" class="category">
                        <span>📷</span>
                        <small>PHOTO</small>
                    </a>

                    <a href="contact.html" class="category">
                        <span>✉</span>
                        <small>CONTACT</small>
                    </a>

                    <a href="resume.pdf" class="category">
                        <span>📄</span>
                        <small>RESUME</small>
                    </a>

                    <a href="art.html" class="category">
                        <span>🦋</span>
                        <small>ART</small>
                    </a>

                    <a href="more.html" class="category">
                        <span>☆</span>
                        <small>MORE</small>
                    </a>

                </div>

            </div>

            <div class="side-buttons">
                <a href="about.html">♡</a>
                <a href="works.html">▦</a>
                <a href="contact.html">☻</a>
            </div>

        </div>

        <div class="controls">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>
    
    <h2 class="heading">MY PROJECTS</h2>

    <div class="projects">

        <a href="project1.html"
           class="project"
           data-preview="images/project1.jpg"
           data-title="PROJECT ONE">

            <img src="images/icon1.png" alt="Project one">
            <small>PROJECT 01</small>
        </a>

        <a href="project2.html"
           class="project"
           data-preview="images/project2.jpg"
           data-title="PROJECT TWO">

            <img src="images/icon2.png" alt="Project two">
            <small>PROJECT 02</small>
        </a>

        <a href="project3.html"
           class="project"
           data-preview="images/project3.jpg"
           data-title="PROJECT THREE">

            <img src="images/icon3.png" alt="Project three">
            <small>PROJECT 03</small>
        </a>

        <a href="project4.html"
           class="project"
           data-preview="images/project4.jpg"
           data-title="PROJECT FOUR">

            <img src="images/icon4.png" alt="Project four">
            <small>PROJECT 04</small>
        </a>

        <a href="project5.html"
           class="project"
           data-preview="images/project5.jpg"
           data-title="PROJECT FIVE">

            <img src="images/icon5.png" alt="Project five">
            <small>PROJECT 05</small>
        </a>

    </div>

    <footer>♡ THANK YOU FOR VISITING ♡</footer>

</div>

<script>
const preview = document.getElementById("mainPreview");
const caption = document.getElementById("caption");

const originalImage = "images/profile.jpg";
const originalCaption = "WELCOME TO MY WORLD ♡";

document.querySelectorAll(".project").forEach(project => {

    project.addEventListener("mouseenter", () => {
        preview.src = project.dataset.preview;
        caption.textContent = project.dataset.title;
    });

    project.addEventListener("mouseleave", () => {
        preview.src = originalImage;
        caption.textContent = originalCaption;
    });

    project.addEventListener("focus", () => {
        preview.src = project.dataset.preview;
        caption.textContent = project.dataset.title;
    });

    project.addEventListener("blur", () => {
        preview.src = originalImage;
        caption.textContent = originalCaption;
    });

});
</script>

</body>
</html>
